[workspace]
members = [".", "betteryam-runtime", "yandexmini", "yandexmicro"]
default-members = ["."]
resolver = "2"

[package]
name = "betteryam-cli"
version = "0.1.18"
edition = "2021"

[[bin]]
name = "byam"
path = "src/bin/yam.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde_json = "1"
